[package]
name = "sov-probe"
version = "0.1.0"
edition = "2021"
description = "铁幕·带外零信任主权平台 - 零拷贝网络探针 (sovProbe)"
license = "Apache-2.0"

[[bin]]
name = "sovprobe"
path = "src/main.rs"

[[bin]]
name = "genwal"
path = "src/bin/genwal.rs"

[lib]
name = "sov_probe"
path = "src/lib.rs"

[dependencies]
# 捕获层：纯 Rust eBPF
aya = "0.14"
libc = "0.2"
# 解析层：零拷贝协议头解析
etherparse = "0.13"
# 线程间无锁队列
crossbeam-channel = "0.5"
# 资源采集
procfs = "0.16"
# 配置与 CLI
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
# 错误处理
anyhow = "1"
# 日志与指标
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 时间
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 字节工具
byteorder = "1"
hex = "0.4"
crc32fast = "1"

# sov2pcap 转码：标准 PCAP 写入
pcap-file = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace]
