[package]
name = "e2e-tools"
version = "0.1.0"
edition = "2021"
description = "E2E test tools for sovProbe: sub_save_test receiver/reassembler, WAL generators"

[[bin]]
name = "sub_save_test"
path = "src/bin/sub_save_test.rs"

[[bin]]
name = "genwal_distinct"
path = "src/bin/genwal_distinct.rs"

[[bin]]
name = "zenoh_pub_enc"
path = "src/bin/zenoh_pub_enc.rs"

[[bin]]
name = "zenoh_pub_probe"
path = "src/bin/zenoh_pub_probe.rs"

[dependencies]
sov-probe = { path = "../sov-probe" }
# 共享 Zenoh 帧契约（开源：github.com/dataxcash/slimRAG workspace member slim-common）
slim-common = { git = "https://github.com/dataxcash/slimRAG.git", branch = "main" }
zenoh = "1.9.0"
chacha20poly1305 = "0.10"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
byteorder = "1"
crc32fast = "1"
tokio = { version = "1", features = ["full"] }
